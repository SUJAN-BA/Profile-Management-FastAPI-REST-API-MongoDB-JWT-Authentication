<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Detail</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <script src="/static/app.js?v=3" defer></script>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/profile" aria-current="page">Profile Detail</a>
        </div>
        <button id="logout-button" class="logout-button" type="button">Logout</button>
    </nav>

    <main class="profile-page">
        <h1>Profile Detail</h1>
        <section id="profile-view" aria-label="Saved profile details" hidden>
            <dl class="profile-details">
                <div>
                    <dt>Name</dt>
                    <dd id="profile-name"></dd>
                </div>
                <div>
                    <dt>Phone number</dt>
                    <dd id="profile-phone-number"></dd>
                </div>
                <div>
                    <dt>Date of birth</dt>
                    <dd id="profile-date-of-birth"></dd>
                </div>
                <div>
                    <dt>Gender</dt>
                    <dd id="profile-gender"></dd>
                </div>
                <div>
                    <dt>Are you from JSS College?</dt>
                    <dd id="profile-jss-student"></dd>
                </div>
                <div>
                    <dt>Hobbies</dt>
                    <dd id="profile-hobbies"></dd>
                </div>
                <div>
                    <dt>Interests</dt>
                    <dd id="profile-interests"></dd>
                </div>
                <div class="profile-detail-wide">
                    <dt>Permanent Address</dt>
                    <dd id="profile-address"></dd>
                </div>
                <div>
                    <dt>Branch</dt>
                    <dd id="profile-branch"></dd>
                </div>
            </dl>
            <button id="edit-profile-button" type="button">Edit Profile</button>
        </section>

        <form id="profile-form" hidden>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" maxlength="100" autocomplete="name" required>

            <label for="phone-number">Phone number</label>
            <input id="phone-number" name="phone_number" type="tel" maxlength="20" autocomplete="tel" required>

            <label for="date-of-birth">Date of birth</label>
            <input id="date-of-birth" name="date_of_birth" type="date" required>

            <fieldset>
                <legend>Gender</legend>
                <label class="choice"><input type="radio" name="gender" value="male" required> Male</label>
                <label class="choice"><input type="radio" name="gender" value="female"> Female</label>
                <label class="choice"><input type="radio" name="gender" value="non_binary"> Non-binary</label>
                <label class="choice"><input type="radio" name="gender" value="other"> Other</label>
                <label class="choice"><input type="radio" name="gender" value="prefer_not_to_say"> Prefer not to say</label>
            </fieldset>

            <fieldset>
                <legend>Are you from JSS College?</legend>
                <label class="choice"><input type="radio" name="is_jss_student" value="true" required> Yes</label>
                <label class="choice"><input type="radio" name="is_jss_student" value="false"> No</label>
            </fieldset>

            <fieldset>
                <legend>Hobbies</legend>
                <label class="choice"><input type="checkbox" name="hobbies" value="Reading"> Reading</label>
                <label class="choice"><input type="checkbox" name="hobbies" value="Sports"> Sports</label>
                <label class="choice"><input type="checkbox" name="hobbies" value="Music"> Music</label>
                <label class="choice"><input type="checkbox" name="hobbies" value="Travelling"> Travelling</label>
            </fieldset>

            <fieldset>
                <legend>Interests</legend>
                <label class="choice"><input type="checkbox" name="interests" value="Technology"> Technology</label>
                <label class="choice"><input type="checkbox" name="interests" value="Programming"> Programming</label>
                <label class="choice"><input type="checkbox" name="interests" value="Business"> Business</label>
                <label class="choice"><input type="checkbox" name="interests" value="Data Science"> Data Science</label>
            </fieldset>

            <label for="address">Permanent Address</label>
            <textarea id="address" name="address" rows="4" required></textarea>

            <label for="branch">Branch</label>
            <select id="branch" name="branch" required>
                <option value="">Select a branch</option>
                <option value="ISE">ISE</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="MECH">MECH</option>
            </select>

            <button type="submit">Save Profile</button>
        </form>
        <p id="message" class="message" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
